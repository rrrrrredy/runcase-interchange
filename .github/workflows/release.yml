name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Build release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\Package-Release.ps1 -Version $version -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE "artifacts")
      - name: Attest archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/*.zip
            artifacts/release-manifest.json
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notesFile = Join-Path $env:GITHUB_WORKSPACE "docs\releases\v$version.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) { throw "Missing curated release notes: $notesFile" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts -File | ForEach-Object FullName) --repo "${{ github.repository }}" --verify-tag --notes-file $notesFile --prerelease --title "RunCase Interchange ${{ github.ref_name }}"
